<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>広報伴走エージェント</title>
<style>
  :root{
    --bg:#F6F9F8; --card:#fff; --ink:#13201E; --muted:#5C6E6B;
    --line:#DBE4E2; --accent:#0D6C67; --accent-b:#E0EFEE;
    --warn:#8A5712; --warn-b:#FAF1E1; --warn-l:#E7D2A8;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#0D1413; --card:#151E1D; --ink:#E3ECEA; --muted:#92A5A2;
           --line:#253230; --accent:#58CCC2; --accent-b:#14312F;
           --warn:#E0AC5A; --warn-b:#2A2113; --warn-l:#4A3A1C; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic Medium","Noto Sans JP",-apple-system,system-ui,sans-serif;
    line-height:1.8;font-size:15.5px}
  .wrap{max-width:44rem;margin:0 auto;padding:1.5rem 1rem 5rem}
  header{display:flex;align-items:baseline;gap:.7rem;flex-wrap:wrap;margin-bottom:1.2rem}
  h1{font-size:1.15rem;margin:0;letter-spacing:.01em}
  .status{font-size:.74rem;color:var(--muted);border:1px solid var(--line);
    border-radius:99px;padding:.1rem .6rem}
  .msg{background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:1.15rem 1.3rem;margin-bottom:.9rem}
  .msg h2{font-size:.72rem;letter-spacing:.13em;text-transform:uppercase;
    color:var(--accent);margin:0 0 .6rem;font-weight:700}
  .msg p{margin:0 0 .6rem}
  .msg p:last-child{margin-bottom:0}
  .kv{display:flex;gap:.8rem;flex-wrap:wrap;margin:.5rem 0 0}
  .kv div{background:var(--accent-b);border-radius:8px;padding:.5rem .8rem;min-width:7rem}
  .kv .n{font-size:1.15rem;font-weight:700;font-variant-numeric:tabular-nums}
  .kv .l{font-size:.72rem;color:var(--muted)}
  .chart{display:flex;align-items:flex-end;gap:4px;height:110px;margin-top:.7rem}
  .chart div{flex:1;background:var(--accent-b);border-radius:3px 3px 0 0;min-height:3px;
    position:relative}
  .chart div.hi{background:var(--accent)}
  .chart div i{position:absolute;top:-1.15rem;left:0;right:0;text-align:center;
    font-style:normal;font-size:.68rem;color:var(--muted);font-variant-numeric:tabular-nums}
  .chart{align-items:flex-end;height:130px;padding-top:1.2rem}
  .axis{display:flex;gap:4px;margin-top:4px}
  .axis span{flex:1;text-align:center;font-size:.62rem;color:var(--muted)}
  table{width:100%;border-collapse:collapse;font-size:.86rem;
    font-variant-numeric:tabular-nums;margin-top:.4rem}
  th,td{text-align:left;padding:.45rem .5rem;border-bottom:1px solid var(--line)}
  th{font-size:.68rem;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
  tr:last-child td{border-bottom:0}
  .feat{border:1px solid var(--line);border-radius:9px;padding:.7rem .9rem;margin-bottom:.5rem}
  .feat b{font-size:.94rem}
  .feat span{display:block;font-size:.82rem;color:var(--muted)}
  .impact{background:var(--warn-b);border:1px solid var(--warn-l);color:var(--warn);
    border-radius:8px;padding:.6rem .85rem;font-size:.85rem;margin-top:.5rem}
  .links a{display:block;font-size:.84rem;color:var(--accent);margin-top:.3rem}
  .ask{font-weight:700;margin:1.4rem 0 .7rem}
  .opts{display:flex;flex-direction:column;gap:.5rem}
  button.opt{text-align:left;background:var(--card);color:var(--ink);
    border:1px solid var(--line);border-radius:10px;padding:.75rem 1rem;
    font:inherit;font-size:.95rem;cursor:pointer;transition:.12s}
  button.opt:hover{border-color:var(--accent);background:var(--accent-b)}
  button.opt:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .you{text-align:right;color:var(--muted);font-size:.88rem;margin:.2rem 0 .9rem}
  .you span{background:var(--accent-b);color:var(--accent);border-radius:99px;
    padding:.3rem .9rem;display:inline-block}
  .src{font-size:.7rem;color:var(--muted);margin-top:.7rem}
  .load{color:var(--muted);font-size:.88rem;padding:.5rem 0}
  .goal{background:var(--accent);color:#fff;border-radius:10px;padding:1.1rem 1.3rem;margin-bottom:.8rem}
  .goal .gn{font-size:1.8rem;font-weight:700;line-height:1.2}
  .goal .gl{font-size:.85rem;opacity:.92;margin-top:.3rem}
  .goal b{color:#fff}

  /* ── 音声 ───────────────────────────────── */
  .vbtn{margin-left:auto;background:var(--card);color:var(--accent);
    border:1px solid var(--line);border-radius:99px;padding:.3rem .9rem;
    font:inherit;font-size:.78rem;cursor:pointer;transition:.12s;white-space:nowrap}
  .vbtn:hover{border-color:var(--accent);background:var(--accent-b)}
  .vbtn.on{background:var(--accent);color:var(--bg);border-color:var(--accent)}
  /* 喋っている一文。字幕として残す */
  .say{display:flex;gap:.6rem;align-items:flex-start;margin:0 0 .8rem;
    font-size:.97rem;line-height:1.85}
  .say b{flex:0 0 auto;width:.5rem;height:.5rem;margin-top:.62rem;border-radius:99px;
    background:var(--line)}
  .say.now b{background:var(--accent);animation:pulse 1.1s ease-in-out infinite}
  .say.now{color:var(--ink)}
  @keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.6);opacity:.45}}
  @media (prefers-reduced-motion:reduce){ .say.now b{animation:none} }
  .mic{display:flex;align-items:center;gap:.6rem;margin-top:.6rem}
  button.micb{background:var(--card);color:var(--ink);border:1px solid var(--line);
    border-radius:99px;padding:.55rem 1.1rem;font:inherit;font-size:.88rem;cursor:pointer}
  button.micb:hover{border-color:var(--accent);background:var(--accent-b)}
  button.micb.rec{background:var(--warn-b);border-color:var(--warn-l);color:var(--warn)}
  .mic span{font-size:.78rem;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>広報伴走エージェント</h1>
    <span class="status" id="status">接続確認中…</span>
    <button class="vbtn" id="vbtn" hidden>🔊 音声で聞く</button>
  </header>
  <select id="picker" style="display:none;width:100%;padding:.5rem;margin-bottom:1rem;
    border:1px solid var(--line);border-radius:8px;background:var(--card);
    color:var(--ink);font:inherit;font-size:.85rem"></select>
  <div id="feed"></div>
</div>

<script>
const feed = document.getElementById('feed');
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let COMPANY_ID = Number(new URLSearchParams(location.search).get('company') || 0);

fetch('/api/health').then(r => r.json()).then(h => {
  document.getElementById('status').textContent =
    (h.mock ? 'モックデータ' : 'DB接続') + ' / ' + (h.openai_key ? 'AI SDK' : 'テンプレート');
  HAS_VOICE = Boolean(h.voice);
  if(HAS_VOICE) document.getElementById('vbtn').hidden = false;
  if(!h.mock) fetch('/api/stopped').then(r=>r.json()).then(j=>{
    const sel = document.getElementById('picker');
    if(!j.items?.length) return;
    sel.style.display='block';
    sel.innerHTML = '<option value="">対象企業を切り替える…</option>' +
      j.items.map(i=>`<option value="${i.company_id}">${i.company_name}（${i.releases}本・${String(i.last_at).slice(0,7)}）</option>`).join('');
    sel.onchange = () => { if(sel.value){ COMPANY_ID = Number(sel.value); start(); } };
  }).catch(()=>{});
}).catch(() => {});

function el(html){ const d = document.createElement('div'); d.innerHTML = html.trim(); return d.firstElementChild; }
function add(node){ feed.appendChild(node); node.scrollIntoView({behavior:'smooth', block:'end'}); }

function bars(items, valueKey, labelKey, hiPred, fmt){
  const top = Math.max(...items.map(i => i[valueKey] || 0)) || 1;
  const b = items.map(i =>
    `<div class="${hiPred(i)?'hi':''}" style="height:${Math.max(Math.round((i[valueKey]||0)/top*100),4)}%"><i>${fmt(i)}</i></div>`).join('');
  const ax = items.map(i => `<span>${esc(i[labelKey])}</span>`).join('');
  return `<div class="chart">${b}</div><div class="axis">${ax}</div>`;
}

/* ── 音声 ─────────────────────────────────────────────
   喋る内容はサーバで確定済みの台本（d.speech）。ここでは文章を作らない。
   1文ずつ再生し、その文が指すブロックだけを画面に出す。 */
let VOICE = false;      // 読み上げのオン/オフ（利用者が押して切り替える）
let HAS_VOICE = false;  // サーバに音声キーがあるか（/api/health で決まる）
let LAST = null, RUN = 0;
const player = new Audio();
const clips = new Map();   // 台本の文 → 音声URL。同じ文を二度取りに行かない

function fetchTTS(text){
  if(clips.has(text)) return clips.get(text);
  const p = fetch('/api/tts', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ text }),
  }).then(r => r.status === 204 ? null : r.blob())
    .then(b => b ? URL.createObjectURL(b) : null)
    .catch(() => null);
  clips.set(text, p);
  return p;
}

function playClip(url){
  return new Promise(done => {
    if(!url) return done();
    player.src = url;
    player.onended = done;
    player.onerror = done;
    player.play().catch(done);   // 自動再生が拒否されたら黙って字幕だけ進める
  });
}

function stopVoice(){ RUN++; player.pause(); player.removeAttribute('src'); }

/** 台本に合わせてブロックを出しながら喋る */
async function perform(d, nodes){
  const run = RUN;
  const shown = new Set();
  const reveal = (key) => nodes
    .filter(n => n.key === key && !shown.has(n))
    .forEach(n => { shown.add(n); add(n.node); });

  const segs = d.speech;
  let pending = fetchTTS(segs[0].text);        // 1文目は先に取りに行く

  for(let i = 0; i < segs.length; i++){
    const url = await pending;
    if(run !== RUN) return;                    // 途中で企業が切り替わった
    pending = segs[i+1] ? fetchTTS(segs[i+1].text) : null;   // 喋る前に次を仕込む

    if(segs[i].block !== 'question') reveal(segs[i].block);
    const line = el(`<div class="say now"><b></b><span>${esc(segs[i].text)}</span></div>`);
    add(line);
    await playClip(url);
    line.classList.remove('now');
    if(run !== RUN) return;
  }

  nodes.forEach(n => { if(!shown.has(n)) add(n.node); });
  askQuestion(d);
}

/* マイクが使えない理由は複数あり、名前だけでは直しようがないので、
   何をすれば直るかまで出す。macOS側で拒否されている場合が特に分かりにくい。 */
const MIC_HELP = {
  NotAllowedError: 'ブラウザかmacOSでマイクが拒否されています。'
    + 'アドレスバー左の🔒→マイクを「許可」、それでも駄目ならシステム設定→'
    + 'プライバシーとセキュリティ→マイクでブラウザをオンにして、ブラウザを再起動してください',
  NotFoundError: 'マイクが見つかりません。入力デバイスを確認してください',
  NotReadableError: 'マイクを他のアプリが使用中です。Zoom・Meet等を閉じてください',
  OverconstrainedError: '対応する入力デバイスがありません',
  SecurityError: 'この配信元では使えません。localhost か https で開いてください',
};

/** 声で答える。聞き取った内容はサーバ側で4択に落とす */
function micRow(clear){
  const row = el(`<div class="mic"><button class="micb">🎙 声で答える</button><span></span></div>`);
  const btn = row.querySelector('button'), note = row.querySelector('span');
  let rec = null, chunks = [], started = 0;

  const fail = (msg) => { note.textContent = msg; btn.classList.remove('rec'); btn.textContent = '🎙 声で答える'; };

  if(!navigator.mediaDevices?.getUserMedia){
    btn.disabled = true;
    fail(isSecureContext ? 'このブラウザは録音に対応していません（Chrome推奨）'
                         : 'httpで開いているため録音できません。localhost か https で開いてください');
    return row;
  }
  if(typeof MediaRecorder === 'undefined'){
    btn.disabled = true;
    fail('このブラウザは録音に対応していません（Chrome推奨）');
    return row;
  }

  btn.onclick = async () => {
    if(rec && rec.state === 'recording') return rec.stop();
    let stream;
    try{
      stream = await navigator.mediaDevices.getUserMedia({ audio:true });
    }catch(e){
      return fail(MIC_HELP[e.name] || `マイクが使えません（${e.name}: ${e.message}）`);
    }
    try{
      // 対応形式はブラウザで違う。Chromeはwebm/opus、Safariはmp4になる
      const mime = ['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/ogg']
        .find(m => MediaRecorder.isTypeSupported(m));
      rec = new MediaRecorder(stream, mime ? { mimeType: mime } : undefined);
      chunks = [];
      rec.ondataavailable = e => e.data.size && chunks.push(e.data);
      rec.onerror = (e) => fail(`録音に失敗しました（${e.error?.name || 'unknown'}）`);
      rec.onstop = async () => {
        stream.getTracks().forEach(t => t.stop());
        btn.classList.remove('rec');
        btn.textContent = '🎙 声で答える';

        const blob = new Blob(chunks, { type: rec.mimeType || 'audio/webm' });
        if(Date.now() - started < 700 || blob.size < 2000)
          return fail('短すぎます。ボタンを押したまま2秒ほど話してください');

        note.textContent = '聞き取っています…';
        let r;
        try{
          const res = await fetch('/api/stt', {
            method:'POST', headers:{'Content-Type': blob.type || 'audio/webm'}, body: blob,
          });
          r = await res.json();
          if(!res.ok) return fail(`サーバ側で失敗しました（${res.status}: ${r.error || ''}）`);
        }catch(e){ return fail(`送信に失敗しました（${e.name}）`); }

        if(!r.text) return fail('聞き取れませんでした。もう一度お願いします');
        clear();
        choose({ id: r.choice_id || 'topic', label: r.text });
      };
      rec.start();
      started = Date.now();
      btn.classList.add('rec');
      btn.textContent = '■ 話し終わったら押す';
      note.textContent = '聞いています';
    }catch(e){
      stream.getTracks().forEach(t => t.stop());
      fail(`録音を開始できません（${e.name}: ${e.message}）`);
    }
  };
  return row;
}

document.getElementById('vbtn').onclick = (e) => {
  VOICE = !VOICE;
  e.target.classList.toggle('on', VOICE);
  e.target.textContent = VOICE ? '🔊 音声オン' : '🔊 音声で聞く';
  stopVoice();
  feed.innerHTML = '';
  if(LAST) renderTurn(LAST);   // 取り直さず、同じ内容をそのまま喋り直す
  else start();
};

/** ブロックをDOMにするだけ。いつ出すかは呼ぶ側が決める（音声と歩調を合わせるため） */
function buildNodes(d){
  const nodes = [];
  for(const b of d.blocks){
    let inner = '';
    if(b.type === 'diagnosis'){
      inner = `<div class="kv">
        <div><div class="n">${b.facts.total_releases}本</div><div class="l">これまでの配信</div></div>
        <div><div class="n">${b.facts.stopped_months ?? '—'}か月</div><div class="l">最終配信からの経過</div></div>
      </div>`;
      if(b.facts.recent?.length){
        inner += `<table style="margin-top:.7rem"><tr><th>直近のリリース</th><th>PV</th></tr>` +
          b.facts.recent.map(r => `<tr><td>${esc(r.title)}</td><td>${r.page_view ?? '—'}</td></tr>`).join('') + `</table>`;
      }
    }
    if(b.type === 'hitcurve'){
      const mine = b.buckets.find(x => x.bucket === b.mine);
      inner = `<p>いま御社は<b>${esc(b.mine)}</b>の位置で、同じ業種でそこに留まった企業のうち手応えのある結果に届いたのは<b>${mine?.hit_pct ?? '—'}%</b>です。</p>`
        + bars(b.buckets, 'hit_pct', 'bucket', i => i.bucket === b.mine, i => i.hit_pct + '%')
        + `<p class="src">${esc(b.evidence.axes.join(' / '))} の ${b.evidence.companies.toLocaleString()}社。「手応えのある結果」＝1本でも ${b.threshold_pv}PV以上（業種内の上位10%）に届いたこと。</p>`;
    }
    if(b.type === 'resume'){
      const g = b.segment;
      inner = `<div class="kv">
          <div><div class="n">${g.companies.toLocaleString()}社</div><div class="l">同じところで止まってから再開</div></div>
          <div><div class="n">${g.hit_before_pct}% → <span style="color:var(--accent)">${g.hit_after_pct}%</span></div><div class="l">再開前 → 再開後の当たり率</div></div>
          <div><div class="n">${g.added_p50}本</div><div class="l">再開後に追加した本数（中央値）</div></div>
        </div>
        <table style="margin-top:.8rem"><tr><th>空いていた期間</th><th>再開した企業</th></tr>
        ${b.gaps.map(x => `<tr><td>${esc(x.gap)}</td><td>${x.companies.toLocaleString()}社</td></tr>`).join('')}</table>
        <p class="src">この業種では合計 ${b.total.toLocaleString()}社が一度止まってから戻ってきています。</p>`;
    }
    if(b.type === 'unused_features'){
      if(!b.items.length) continue;
      inner = b.items.map(i => `<div class="feat"><b>${esc(i.label)}</b><span>${esc(i.detected)}</span>
        ${i.impact ? `<div class="impact">使っているリリースは <b>${i.impact.with}%</b> が手応えのある結果に届き、使っていないものは ${i.impact.without}%。<b>約${i.impact.ratio}倍</b>の差があります（同業${i.impact.n.toLocaleString()}本）</div>` : ''}</div>`).join('');
    }
    if(b.type === 'outlook'){
      const rt = b.facts.resume_target;
      inner = rt
        ? `<div class="goal"><div class="gn">あと${rt.added_p50}本</div>
             <div class="gl">同じところから再開した${rt.companies.toLocaleString()}社の中央値。ここまでで <b>${rt.hit_after_pct}%</b> が手応えのある結果に届いています</div></div>
           <table><tr><th>ペース</th><th>かかる期間</th></tr>
             <tr><td>月1本</td><td>${rt.added_p50}か月</td></tr>
             <tr><td>2か月に1本</td><td>${rt.added_p50*2}か月</td></tr>
             <tr><td>3か月に1本</td><td>${rt.added_p50*3}か月</td></tr></table>`
        : b.facts.steps.length
        ? `<p>いまは<b>${b.facts.now}本</b>で<b>${b.facts.current_pct}%</b>の地点です。</p>
           <table><tr><th>目標</th><th>あと</th><th>当たり率</th><th>月1本なら</th><th>3か月に1本なら</th></tr>
           ${b.facts.steps.map(s => `<tr><td>${s.target}本</td><td>${s.need}本</td><td><b>${s.hit_pct}%</b></td><td>${s.months_monthly}か月</td><td>${s.months_quarterly}か月</td></tr>`).join('')}</table>`
        : `<p>すでに十分な本数を配信しています。</p>`;
    }
    if(b.type === 'period'){
      inner = `<table><tr><th>初回からの経過</th><th>当たり率</th><th>配信本数の中央値</th><th>累積PVの中央値</th></tr>
        ${b.rows.map(r => `<tr><td>${r.months}か月</td><td>${r.hit_pct}%</td><td>${r.releases_p50}本</td><td>${r.cum_pv_p50}</td></tr>`).join('')}</table>
        <p class="src">3年経っても当たり率は上がりきりません。中央値の企業が3年で${b.rows[b.rows.length-1].releases_p50}本しか出していないためです。<b>時間ではなく本数が効きます。</b></p>`;
    }
    if(b.type === 'trends'){
      if(!b.items.length) continue;
      inner = `<table><tr><th>種別</th><th>PV中央値</th><th>上位10%</th><th>件数</th></tr>
        ${b.items.map(i => `<tr><td>${esc(i.release_type_name)}</td><td>${i.pv_p50 ?? '—'}</td><td><b>${i.pv_p90 ?? '—'}</b></td><td>${i.n.toLocaleString()}</td></tr>`).join('')}</table>
        <p class="src">上位10%の数字が大きいほど「跳ねやすい」種別です。</p>`;
    }
    if(b.type === 'features'){
      inner = b.items.map(i => `<div class="feat"><b>${esc(i.name)}</b><span>${esc(i.note)}</span></div>`).join('')
        + (b.articles?.length ? `<div class="links">${b.articles.map(a => `<a href="${esc(a[1])}" target="_blank" rel="noopener">${esc(a[0])}</a>`).join('')}</div>` : '');
    }
    if(inner) nodes.push({ key: b.type, node: el(`<div class="msg"><h2>${esc(b.title)}</h2>${inner}</div>`) });
  }

  // 音声ONのときは同じ文を字幕として1文ずつ出すので、この塊は出典だけにする
  const n = d.narrative || {};
  const paras = VOICE ? '' : ['position','lottery','resume','outlook','time','trend','feature']
    .filter(k => n[k]).map(k => `<p>${esc(n[k])}</p>`).join('');
  if(paras) nodes.push({ key:'narrative', node: el(`<div class="msg">${paras}<div class="src">${esc(n.source||'')}</div></div>`) });
  else if(VOICE && n.source) nodes.push({ key:'narrative', node: el(`<div class="src">${esc(n.source)}</div>`) });

  return nodes;
}

function askQuestion(d){
  if(!d.question) return;
  add(el(`<div class="ask">${esc(d.question.text)}</div>`));
  const box = el('<div class="opts"></div>');
  const clear = () => { box.remove(); document.querySelector('.ask')?.remove(); };
  for(const o of d.question.options){
    const bt = el(`<button class="opt">${esc(o.label)}</button>`);
    bt.onclick = () => { clear(); choose(o); };
    box.appendChild(bt);
  }
  add(box);
  // 4択に落とせる問いだけ、声でも答えられるようにする
  // 4択に落とせる問いなら、読み上げのオン/オフに関係なく声でも答えられるようにする
  if(HAS_VOICE && d.question.id === 'interest') box.appendChild(micRow(clear));
}

function renderTurn(d){
  LAST = d;
  const nodes = buildNodes(d);
  if(VOICE && d.speech?.length) return perform(d, nodes);
  nodes.forEach(n => add(n.node));
  askQuestion(d);
}

async function choose(o){
  add(el(`<div class="you"><span>${esc(o.label)}</span></div>`));
  if(o.id === 'back'){ return start(); }
  if(o.id === 'ok'){
    return add(el(`<div class="msg"><p>この内容をもとに、次の1本を用意していきましょう。</p></div>`));
  }
  const load = el('<div class="load">実績を集計しています…</div>');
  add(load);
  const r = await fetch('/api/messages', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ company_id: COMPANY_ID, choice_id: o.id }),
  }).then(r => r.json());
  load.remove();
  if(r.error) return add(el(`<div class="msg"><p>エラー: ${esc(r.error)}</p></div>`));
  renderTurn(r);
}

async function start(){
  stopVoice();
  feed.innerHTML = '';
  const load = el('<div class="load">御社の状況を確認しています…</div>');
  add(load);
  const r = await fetch('/api/sessions', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ company_id: COMPANY_ID }),
  }).then(r => r.json());
  load.remove();
  if(r.error) return add(el(`<div class="msg"><p>エラー: ${esc(r.error)}</p></div>`));
  renderTurn(r);
}

start();
</script>
</body>
</html>
