name: Docker Publish

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
  workflow_dispatch:

# 同じブランチに続けて push したら古い実行は打ち切る
concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  # ghcr.io/prtimes-hackathon-2026/app
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    # PR は fork からのものと、リポジトリに関わりのない人からのものを弾く。
    # push / tag / 手動実行は書き込み権限のある人しか起こせないので素通しでよい
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR", "CONTRIBUTOR"]'),
      github.event.pull_request.author_association))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # GITHUB_TOKEN で GHCR に push するために必要
      packages: write

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      # PR ではビルドが通ることの確認だけで、push はしない
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # main への push は latest
            type=raw,value=latest,enable={{is_default_branch}}
            # v1.2.3 タグからは 1.2.3 / 1.2 / 1 を生やす
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            # どのコミットのイメージか常に辿れるようにする
            type=sha,format=long

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          # linux/amd64 のみ。arm64 も要るなら platforms に足す (ビルド時間は倍になる)
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # レイヤーキャッシュを Actions のキャッシュに退避して次回のビルドを短くする
          cache-from: type=gha
          cache-to: type=gha,mode=max
