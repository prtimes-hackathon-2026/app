name: Docker Publish

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
  workflow_dispatch:

# 同じブランチに続けて push したら古い実行は打ち切る
concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  # ghcr.io/prtimes-hackathon-2026/app
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    # PR は fork からのものと、リポジトリに関わりのない人からのものを弾く。
    # push / tag / 手動実行は書き込み権限のある人しか起こせないので素通しでよい
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR", "CONTRIBUTOR"]'),
      github.event.pull_request.author_association))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # GITHUB_TOKEN で GHCR に push するために必要
      packages: write

    outputs:
      # preview ジョブがそのまま Terraform に渡すタグ
      preview_image_tag: ${{ steps.preview_tag.outputs.tag }}

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      # PR プレビューはコミットごとに別のタグを指す。pr-<番号> のような可変タグ
      # だと、push しても Terraform 側に差分が出ずプレビューが入れ替わらない
      - name: プレビュー用のタグを決める
        id: preview_tag
        if: github.event_name == 'pull_request'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: echo "tag=pr-${PR_NUMBER}-${HEAD_SHA:0:7}" >>"$GITHUB_OUTPUT"

      # PR も push する (プレビューが pull できないと意味がない)。fork や
      # 無関係な人の PR はこのジョブの if で既に弾いてある
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # main への push は latest
            type=raw,value=latest,enable={{is_default_branch}}
            # v1.2.3 タグからは 1.2.3 / 1.2 / 1 を生やす
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            # どのコミットのイメージか常に辿れるようにする
            type=sha,format=long
            # PR は pr-<番号> (人が触る用) と pr-<番号>-<sha> (プレビューが指す用)
            type=ref,event=pr
            type=raw,value=${{ steps.preview_tag.outputs.tag }},enable=${{ github.event_name == 'pull_request' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          # linux/amd64 のみ。arm64 も要るなら platforms に足す (ビルド時間は倍になる)
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # レイヤーキャッシュを Actions のキャッシュに退避して次回のビルドを短くする
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # プレビューの登録は「別ワークフロー」ではなくここに置いて needs: build を付ける。
  # 別ワークフローにすると同じ pull_request イベントから独立に起動するため、
  # イメージの publish より先に TFC の run が進み、まだ無いタグを pull しようと
  # してタスクが起動しない
  preview:
    needs: build
    if: github.event_name == 'pull_request' && vars.PREVIEW_ENABLED == 'true'
    uses: ./.github/workflows/preview.yml
    with:
      pr_number: ${{ github.event.pull_request.number }}
      image_tag: ${{ needs.build.outputs.preview_image_tag }}
    secrets:
      TFC_TOKEN: ${{ secrets.TFC_TOKEN }}
    permissions:
      contents: read
      pull-requests: write
    # TFC の変数は読んで書くので直列化する。PR 番号を入れないグループ名にして、
    # 削除側 (preview-cleanup.yml) とも競合しないようにする
    concurrency:
      group: preview-tfc
      cancel-in-progress: false

  deploy:
    needs: build
    # main への push だけ。タグ push は :latest を動かさないので対象外。
    # AWS_DEPLOY_ROLE_ARN が未設定のうちは黙ってスキップする (infra 側の
    # terraform apply が済むまではロールがまだ存在しない)
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      vars.AWS_DEPLOY_ROLE_ARN != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # OIDC トークンを発行してもらうために必要。これがないと
      # configure-aws-credentials が認証情報を取れない
      id-token: write

    env:
      # infra リポジトリの terraform output ecs_cluster_name / ecs_service_name
      AWS_REGION: ap-northeast-1
      CLUSTER: webapp-dev
      SERVICE: webapp-dev

    steps:
      # アクセスキーは持たせず、OIDC で 1 時間だけ有効な一時認証情報を受け取る。
      # ロールは infra リポジトリの iam_github_actions.tf が作っている
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # タスク定義の image は :latest 固定なので、Terraform には差分が出ない。
      # 新しいイメージを取り込むにはサービスの入れ替えを明示的に叩く
      - name: Force new deployment
        run: |
          aws ecs update-service \
            --cluster "$CLUSTER" \
            --service "$SERVICE" \
            --force-new-deployment \
            --query 'service.deployments[0].id' \
            --output text

      # 新しいタスクが定常状態になるまで待つ。起動に失敗し続けると
      # deployment circuit breaker が旧タスクへ切り戻し、待ちは 10 分で
      # タイムアウトしてこのジョブが落ちる (= デプロイ失敗に気づける)
      - name: Wait for the service to stabilize
        run: aws ecs wait services-stable --cluster "$CLUSTER" --services "$SERVICE"
