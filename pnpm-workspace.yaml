packages:
  - 'apps/*'
  - 'packages/*'

# 型の同一性を保つため、ワークスペース横断で共有するライブラリはここでバージョンを一元管理する。
# 各 package.json では "catalog:" と書くだけでよい。
catalog:
  hono: ^4.13.1
  typescript: ^6.0.3
  zod: ^4.4.3

# pnpm 10 は依存パッケージの postinstall をデフォルトで実行しない。
# ネイティブバイナリを持つものだけ明示的に許可する。
onlyBuiltDependencies:
  - '@swc/core'
  - esbuild
